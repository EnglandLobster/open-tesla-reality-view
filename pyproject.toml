[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "open-reality-view"
version = "0.1.0"
description = "Open-source replication of Tesla FSD v15 Reality View using Alpamayo2-Edge + DA3 + Wan2.1-VACE-1.3B"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "einops>=0.8.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "huggingface-hub>=0.28.0",
    "transformers>=4.49.0",
    "diffusers>=0.34.0",
    "accelerate>=1.2.0",
    "safetensors>=0.4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
train = [
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "wandb>=0.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_reality_view"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
